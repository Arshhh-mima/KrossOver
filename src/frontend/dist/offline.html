<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KrossOver — Offline</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        background-color: #0f0f1a;
        color: #e8e8f0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .container {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 24px;
        padding: 24px;
        text-align: center;
      }
      .logo {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        object-fit: cover;
        opacity: 0.8;
      }
      .logo-fallback {
        width: 80px;
        height: 80px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6b21a8, #db2777);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 36px;
        font-weight: 900;
        color: #fff;
        letter-spacing: -2px;
      }
      h1 {
        font-size: 24px;
        font-weight: 700;
        color: #e8e8f0;
        letter-spacing: -0.5px;
      }
      p {
        font-size: 15px;
        color: #8888aa;
        max-width: 320px;
        line-height: 1.6;
      }
      .retry-btn {
        margin-top: 8px;
        padding: 12px 28px;
        background: linear-gradient(135deg, #6b21a8, #db2777);
        color: #fff;
        border: none;
        border-radius: 999px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
        transition: opacity 0.2s;
      }
      .retry-btn:hover {
        opacity: 0.88;
      }
      .wifi-icon {
        color: #6b21a8;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <img
        src="/assets/generated/krossover-logo.dim_80x80.png"
        alt="KrossOver"
        class="logo"
        onerror="this.style.display='none'; document.getElementById('logo-fallback').style.display='flex';"
      />
      <div id="logo-fallback" class="logo-fallback" style="display: none;">K</div>
      <h1>KrossOver</h1>
      <svg
        xmlns="http://www.w3.org/2000/svg"
        width="48"
        height="48"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#6b21a8"
        stroke-width="1.5"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="wifi-icon"
      >
        <line x1="1" y1="1" x2="23" y2="23" />
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55" />
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39" />
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9" />
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88" />
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0" />
        <line x1="12" y1="20" x2="12.01" y2="20" />
      </svg>
      <p>You are offline. Please check your connection and try again.</p>
      <button class="retry-btn" onclick="window.location.reload()">
        Try Again
      </button>
    </div>
  </body>
</html>
